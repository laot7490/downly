[package]
name = "downly"
version = "0.8.1"
description = "YouTube video downloader"
authors = ["Emir Genç"]
edition = "2024"
autobins = false

[lib]
name = "downly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Downly"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "blocking"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }
zip = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
