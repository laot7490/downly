[[permission]]
identifier = "downly-commands"
description = "Downly download commands"
commands.allow = [
  "probe",
  "expand_playlist",
  "enqueue",
  "update_queue_metadata",
  "start",
  "stop",
  "finish_live_recording",
  "remove",
  "cancel_item",
  "reorder_queue_item",
  "clear_queue",
  "state",
  "set_download_dir",
  "set_cookies_browser",
  "import_cookies_file",
  "open_path",
  "reveal_path",
  "retry_history",
  "remove_history",
  "archive_session",
  "archive_session_all",
  "retry_failed_session",
  "retry_failed_session_item",
  "retry_cancelled_session_item",
  "remove_cancelled_session_item",
  "remove_failed_session_item",
  "archive_completed_session_all",
  "delete_completed_session_item",
  "clear_history",
  "update_ytdlp",
  "ytdlp_version",
  "ytdlp_info",
  "app_version",
  "check_ytdlp_update",
]
